<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport White BG - Final</title>
<style>body{font-family:system-ui;text-align:center;background:#f5f5f7;padding:15px} .card{max-width:400px;margin:auto;background:#fff;padding:15px;border-radius:15px} button{width:100%;padding:15px;background:#000;color:#fff;border:0;border-radius:10px;font-weight:800;margin-top:10px} canvas{max-width:100%;border-radius:10px;border:1px solid #ddd;margin-top:10px}</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
</head>
<body>
<h2>Passport - White Background</h2>
<div class="card">
<input type="file" id="file" accept="image/*">
<p id="status" style="color:#2457d6;font-weight:700"></p>
<canvas id="cvs"></canvas>
<button onclick="download()">Download White BG Photo</button>
<div style="margin-top:10px">
<button onclick="setSize(400,500)" style="background:#eef;color:#000">Aadhar 400x500</button>
<button onclick="setSize(413,531)" style="background:#eef;color:#000">Passport 35x45</button>
</div>
</div>
<script>
let img=null, w=400, h=500, net=null, finalUrl=null;
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
async function loadNet(){
  document.getElementById('status').innerText='AI load ho raha hai... 5 sec';
  net=await bodyPix.load({architecture:'MobileNetV1',outputStride:16,multiplier:0.75});
  document.getElementById('status').innerText='Ready - photo daalo';
}
loadNet();
function setSize(ww,hh){w=ww;h=hh; if(img) draw();}
document.getElementById('file').onchange=async e=>{
  const file=e.target.files[0]; const url=URL.createObjectURL(file);
  img=new Image(); img.onload=async()=>{await draw();}; img.src=url;
}
async function draw(){
  if(!net || !img) return;
  document.getElementById('status').innerText='Background white kar raha hu...';
  const tmp=document.createElement('canvas'); tmp.width=img.width; tmp.height=img.height;
  const tCtx=tmp.getContext('2d'); tCtx.drawImage(img,0,0);
  const seg=await net.segmentPerson(tmp,{internalResolution:'medium',segmentationThreshold:0.7});
  cvs.width=w; cvs.height=h;
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,w,h);
  const imageData=tCtx.getImageData(0,0,img.width,img.height);
  for(let i=0;i<seg.data.length;i++){ if(seg.data[i]==0) imageData.data[i*4+3]=0; }
  tCtx.putImageData(imageData,0,0);
  const scale=Math.min(w/img.width,h/img.height)*0.85;
  const nw=img.width*scale, nh=img.height*scale;
  const x=(w-nw)/2, y=(h-nh)/2;
  ctx.drawImage(tmp,x,y,nw,nh);
  finalUrl=cvs.toDataURL('image/jpeg',0.98);
  document.getElementById('status').innerText='Ho gaya! White background ready';
}
function download(){
  if(!finalUrl){alert('Pehle photo daal'); return;}
  const a=document.createElement('a'); a.href=finalUrl; a.download='white-bg-'+w+'x'+h+'.jpg';
  document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
