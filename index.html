<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Photo Official - Exact Size</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f7fb;color:#111}
.head{max-width:1200px;margin:auto;padding:20px;text-align:center}
.head h1{font-size:28px;font-weight:900}
.head p{color:#555;margin-top:6px}
.searchWrap{max-width:700px;margin:18px auto;background:#fff;border:2px solid #2563eb;border-radius:14px;display:flex;align-items:center;padding:0 16px}
.searchWrap input{flex:1;border:0;outline:none;padding:16px 10px;font-size:16px;background:transparent}
.tabs{max-width:1200px;margin:10px auto;display:flex;gap:8px;overflow:auto;padding:0 15px}
.tab{white-space:nowrap;background:#fff;border:1.5px solid #e5e7eb;padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:#111;color:#fff}
.grid{max-width:1200px;margin:16px auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 15px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1.5px solid #e5e7eb;border-radius:16px;padding:15px;cursor:pointer;transition:.2s}
.card:hover{border-color:#2563eb;transform:translateY(-2px)}
.card h3{font-size:14px}
.card p{font-size:12px;color:#666;margin-top:4px}
.size{margin-top:8px;background:#eef2ff;color:#1d4ed8;display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800}
.page{max-width:900px;margin:0 auto;background:#fff;padding:18px;border-radius:18px;display:none}
.page.active{display:block}
.back{color:#2563eb;font-weight:700;cursor:pointer}
.btn{display:block;width:100%;margin-top:10px;background:#2563eb;color:#fff;text-align:center;padding:16px;border-radius:12px;font-weight:900;border:0;font-size:16px;cursor:pointer}
.btn2{background:#111}
#fileIn{margin-top:16px;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<div class="head">
<h1>Passport Photo Official</h1>
<p>ChatGPT Jaisa Fast - Exact Size Me - 1 Sec Me</p>
<div class="searchWrap"><span>🔍</span><input id="search" oninput="render()" placeholder="Search Aadhaar, USA, Visa..."></div>
</div>
<div class="tabs">
<div class="tab active" onclick="setCat('all',this)">All</div>
<div class="tab" onclick="setCat('passport',this)">Passports</div>
<div class="tab" onclick="setCat('visa',this)">Visas</div>
<div class="tab" onclick="setCat('id',this)">ID Cards</div>
<div class="tab" onclick="setCat('job',this)">Govt Jobs</div>
</div>
<div id="grid" class="grid"></div>

<div id="tool" class="page">
<span class="back" onclick="goHome()">← Back to All Sizes</span>
<h2 id="selTitle" style="margin-top:12px"></h2>
<p id="selInfo" style="color:#2563eb;font-weight:700;margin:6px 0"></p>
<input type="file" id="fileIn" accept="image/*">
<div id="prev" style="display:none;margin-top:18px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><b>Original</b><img id="origImg" style="width:100%;border-radius:12px;border:1px solid #ddd;margin-top:6px;background:#fff"></div>
<div><b id="finalLabel">Final</b><img id="finalImg" style="width:100%;border-radius:12px;border:1px solid #ddd;margin-top:6px;background:#fff"><canvas id="cvs" style="display:none"></canvas>
<button class="btn" onclick="downloadHD()">⬇️ Download - Exact Size</button>
<button class="btn btn2" onclick="downloadA4()">Download A4 Sheet (8 Photos)</button>
</div>
</div>
</div>
</div>

<script>
const DOCS=[
{name:'USA Passport 2x2 Inch',desc:'USA 600x600',w:600,h:600,cat:'passport',id:'usa'},
{name:'India Passport 35x45mm',desc:'India 413x531',w:413,h:531,cat:'passport',id:'india'},
{name:'Canada 50x70mm',desc:'Canada 500x700',w:500,h:700,cat:'passport',id:'canada'},
{name:'Aadhar 400x500',desc:'Aadhar EXACT 400x500',w:400,h:500,cat:'id',id:'aadhar'},
{name:'PAN 300x400',desc:'PAN EXACT 300x400',w:300,h:400,cat:'id',id:'pan'},
{name:'DL 400x500',desc:'DL 400x500',w:400,h:500,cat:'id',id:'dl'},
{name:'USA Visa 2x2',desc:'Visa 600x600',w:600,h:600,cat:'visa',id:'usa-visa'},
{name:'UK Visa 35x45',desc:'UK 413x531',w:413,h:531,cat:'visa',id:'uk-visa'},
{name:'Schengen 35x45',desc:'Schengen 413x531',w:413,h:531,cat:'visa',id:'schengen'},
{name:'SSC Photo',desc:'SSC 413x531',w:413,h:531,cat:'job',id:'ssc'},
{name:'UPSC 350x350',desc:'UPSC 350x350',w:350,h:350,cat:'job',id:'upsc'},
];
let curCat='all', curDoc=null, finalDataUrl='';
const $=id=>document.getElementById(id);
setCat=(c,el)=>{curCat=c;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
render=()=>{
  const q=$('search').value.toLowerCase();
  const g=$('grid'); g.innerHTML='';
  DOCS.filter(d=>(curCat==='all'||d.cat===curCat) && d.name.toLowerCase().includes(q)).forEach(d=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<h3>${d.name}</h3><p>${d.desc}</p><div class="size">${d.w}x${d.h} EXACT</div>`;
    div.onclick=()=>{curDoc=d; $('grid').style.display='none'; document.querySelector('.tabs').style.display='none'; document.querySelector('.head').style.display='none'; $('tool').classList.add('active'); $('selTitle').innerText=d.name; $('selInfo').innerText='FINAL SIZE: '+d.w+'x'+d.h+' px EXACT - Isi me banega';};
    g.appendChild(div);
  });
}
goHome=()=>{ $('grid').style.display='grid'; document.querySelector('.tabs').style.display='flex'; document.querySelector('.head').style.display='block'; $('tool').classList.remove('active'); $('prev').style.display='none'; $('fileIn').value='';}

function downloadHD(){ 
  if(!finalDataUrl){ alert('Pehle photo upload karo bhai'); return; }
  const a=document.createElement('a'); a.href=finalDataUrl; a.download=curDoc.id+'-'+curDoc.w+'x'+curDoc.h+'.jpg'; 
  document.body.appendChild(a); a.click(); a.remove();
}
function downloadA4(){
  if(!finalDataUrl){ alert('Pehle photo upload karo'); return; }
  const c=document.createElement('canvas'); c.width=2480; c.height=3508; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); 
  const im=new Image(); im.onload=()=>{for(let r=0;r<4;r++) for(let cc=0;cc<2;cc++) ctx.drawImage(im,120+cc*(curDoc.w+80),120+r*(curDoc.h+80),curDoc.w,curDoc.h); const a=document.createElement('a'); a.href=c.toDataURL('image/jpeg',0.92); a.download='A4-'+curDoc.id+'.jpg'; document.body.appendChild(a); a.click(); a.remove();}; im.src=finalDataUrl;
}

$('fileIn').addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file){ return; }
  if(!curDoc){ alert('Pehle document select karo'); return; }
  const url=URL.createObjectURL(file);
  $('origImg').src=url;
  const img=new Image();
  img.onload=()=>{
    const cvs=$('cvs');
    cvs.width=curDoc.w; 
    cvs.height=curDoc.h;
    const ctx=cvs.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,cvs.width,cvs.height);
    const scale=Math.min(cvs.width/img.width, cvs.height/img.height)*0.92;
    const w=img.width*scale, h=img.height*scale;
    const x=(cvs.width-w)/2, y=(cvs.height-h)/2 - h*0.04;
    ctx.drawImage(img,x,y,w,h);
    finalDataUrl=cvs.toDataURL('image/jpeg',0.98);
    $('finalImg').src=finalDataUrl;
    $('finalLabel').innerText='Final EXACT '+curDoc.w+'x'+curDoc.h+' px';
    $('prev').style.display='block';
    window.scrollTo(0,document.body.scrollHeight);
  };
  img.src=url;
});
render();
</script>
</body>
</html>
